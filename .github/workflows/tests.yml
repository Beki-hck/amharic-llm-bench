name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: suites are up to date with scripts/build_suites.py
        run: python scripts/build_suites.py && git diff --exit-code src/amharic_bench/suites
      - run: pytest -q
      - run: amharic-bench list
